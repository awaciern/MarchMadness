services:
  - type: web
    name: march-madness
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir Python --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 3600 app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8